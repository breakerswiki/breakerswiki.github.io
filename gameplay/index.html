<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <base href="/" />
    <title>Breakers Wiki - Gameplay</title>
    <meta name="description" content="Breakers revenge, core mechanics, character playstyles, and matchup tips" />
    <meta name="theme-color">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" href="img/assets/apple-touch-icon.png">
    <link rel="manifest" href="img/manifest.json">
    <script src="script.js"></script>
</head>

<style>
    body {
        touch-action: manipulation !important;
    }
</style>

<body>


    <div id="header-container"></div>

    <div class="main-content ">
        <br>

        <div class="gameplay">

            <div class="tv-container">
                <img src="/img/assets/TV.webp" class="tv" loading="lazy" alt="Decorative TV frame">
                <!-- <div class="tv-noise"></div> -->


                <div>
                    
                    <video id="gameplay-video" playsinline loop controls preload="metadata">
                        <source src="/gameplay/videos/br-how-to-play.mp4" type="video/mp4">
                        Your browser does support HTML5 video.
                    </video>
                    
                </div>
                
            </div>


            <div id="video-text" class="video-text">

            </div>

        </div>
<div class="button-container">
    <button class="card-nav-button prev-button" aria-label="Previous">❮</button>
    <div id="card-dots" class="card-dots"></div>
    <button class="card-nav-button next-button" aria-label="Next">❯</button>
</div>
    </div>


    </div>
    <!-- footer  -->
    <div id="footer-container"></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const video = document.getElementById("gameplay-video");
    const text = document.getElementById("video-text");
    const dotsContainer = document.getElementById("card-dots");
    const prev = document.querySelector(".prev-button");
    const next = document.querySelector(".next-button");

            const videos = [
                {
                    src: "/gameplay/videos/br-how-to-play.mp4",
                    text: `
                    <h1>Button layout</h1><p>
                        Breakers Revenge is commonly played in a square arcade layout
                        <span style="display: inline-block; padding: 2px; border: 1px solid gray;text-align: center; font-size: small; font-weight: bold; line-height: 1; margin-bottom: 1.5em;">
                            <span style="display: block;">
                                <span style="color: red;">A</span>
                                <span style="color: green;">C</span>
                                </span>
                                <span style="display: block;">
                                <span style="color: orange;">B</span>
                                <span style="color: blue;">D</span>
                                </span>
                            </span><br>
                            <span class="arcadebutton A"></span>,<span class="arcadebutton C"></span>= Punch <br> <span class="arcadebutton B"></span>,<span class="arcadebutton D"></span>= Kick
                    </p>
                    `},
                { src: "/gameplay/videos/throw.mp4", text: `
                    <h1>Throws</h1>
                    <p>
                        → / ← + <span class="arcadebutton C"></span><br>
                        Throws can be used to interrupt (break) some jump-ins and combos. Certain characters also have extra throw moves.
                    </p>
                    ` },
                { src: "/gameplay/videos/supers.mp4", text: `
                    <h1>Supers</h1>
                    <p>
                        Super meter holds 3 stocks, fills by attacking, dashing, taunting, or taking/blocking hits.
                    </p>
                    ` },
                { src: "/gameplay/videos/juggles.mp4", text: `
                    <h1>Combos</h1>
                    <p>
                        The game features an accessible combo system with plenty of cancelable moves and super juggles.                    </p>
                    ` },
                { src: "/gameplay/videos/roll.mp4", text: `
                    <h1>Back roll</h1>
                    <p>
                        After a non-super hit, press 3 buttons when knocked down to escape pressure and avoid follow-ups.
                    </p>
                    ` },
                { src: "/gameplay/videos/dash.mp4", text: `
                    <h1>Dashes</h1>
                    <p>
                        →→ / ←← <br>
                        All characters except Condor can dash. Some have invincible backdashes, while others can cancel dashes for faster movement or longer jumps.
                    </p>
                    ` },
                { src: "/gameplay/videos/dizzy.mp4", text: `
                    <h1>Dizzy</h1>
                    <p> Repeated hits can cause dizziness. Mash directions and buttons to recover instantly with brief invincibility.</p>
                    ` },
                { src: "/gameplay/videos/chip.mp4", text: `
                    <h1>Chip damage</h1>
                    <p>
                        Chip damage is the health lost while blocking, preventing endless defense and can cause a KO. Supers deal little chip, so use specials to finish opponents.
                    </p>
                    ` },
                { src: "/gameplay/videos/breakers.mp4", text: `
                    <h1>Break</h1>
                    <p>
                        Some combos can be interrupted (broken) with a backdash, throw, or attack. 
                        Master unbreakable combos, identify breakable ones, and use them strategically to bait your opponent.
                    </p>
                    ` },
                { src: "/gameplay/videos/risk.mp4", text: `
                    <h1>Risk system</h1>
                    <p>
                        The longer you remain inactive, the more your damage output increases. 
                        The round winner takes increased damage, while the loser gains defense. 
                        Only the player with higher health receives increased damage until both health bars are equal.
                    </p>
                    ` }
            ];

            let index = 0;

    // Create dots dynamically
    videos.forEach((_, i) => {
        const dot = document.createElement("span");
        dot.classList.add("dot");
        dot.addEventListener("click", () => {
            index = i;
            showVideo();
        });
        dotsContainer.appendChild(dot);
    });

    const dots = dotsContainer.querySelectorAll(".dot");

    function updateDots() {
        dots.forEach((dot, i) => {
            dot.classList.toggle("active", i === index);
        });
    }

    function showVideo() {
        const current = videos[index];
        video.pause();
        video.src = current.src;
        text.innerHTML = current.text;
        prev.disabled = index === 0;
        next.disabled = index === videos.length - 1;
        updateDots();
        video.load();
    }

    prev.addEventListener("click", () => {
        if (index > 0) index--;
        showVideo();
    });

    next.addEventListener("click", () => {
        if (index < videos.length - 1) index++;
        showVideo();
    });

    showVideo();
});
</script>

</body>



</html>
