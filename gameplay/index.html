<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <base href="/" />
    <title>Breakers Wiki - Gameplay</title>
    <meta name="description" content="Breakers revenge, core mechanics, character playstyles, and matchup tips" />
    <meta name="theme-color">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" href="img/assets/apple-touch-icon.png">
    <link rel="manifest" href="img/manifest.json">
    <script src="script.js"></script>
</head>

<style>
    body {
        touch-action: manipulation !important;
    }
</style>

<body>


    <div id="header-container"></div>

    <div class="main-content ">
        <br>

        <div class="gameplay">

            <div class="tv-container">
                <img src="/img/assets/TV.webp" class="tv" loading="lazy" alt="Decorative TV frame">

                <div>
                    <div class="tv-noise"></div>

                    <video id="gameplay-video" playsinline loop preload="metadata">
                        <source src="/gameplay/videos/br-how-to-play.mp4" type="video/mp4">
                        Your browser does support HTML5 video.
                    </video>
                    <button class="play-button" id="playBtn">▶</button>

                </div>

            </div>


            <div id="video-text" class="video-text">

            </div>

        </div>
        <div class="button-container">
            <button class="card-nav-button prev-button" aria-label="Previous">❮</button>
            <div id="card-dots" class="card-dots"></div>
            <button class="card-nav-button next-button" aria-label="Next">❯</button>
        </div>
    </div>


    </div>
    <!-- footer  -->
    <div id="footer-container"></div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const video = document.getElementById("gameplay-video");
            const text = document.getElementById("video-text");
            const dotsContainer = document.getElementById("card-dots");
            const prev = document.querySelector(".prev-button");
            const next = document.querySelector(".next-button");
            const tvNoise = document.querySelector(".tv-noise");
            const playBtn = document.getElementById("playBtn");



            const videos = [
                {
                    src: "/gameplay/videos/br-how-to-play.mp4",
                    text: `
                    <h1>Button layout</h1>
                    <p>
                                                    
                        
                        <span class="arcadebutton A"></span>,<span class="arcadebutton C"></span>= Punch <br> <span class="arcadebutton B"></span>,<span class="arcadebutton D"></span>= Kick <br>

                        
                        In arcade settings, Breakers Revenge is traditionally played on a square layout.
                    </p>
                    `},
                {
                    src: "/gameplay/videos/throw.mp4", text: `
                    <h1>Throws</h1>
                    <p>
                        → / ← + <span class="arcadebutton C"></span><br>
                        Throws can be used to interrupt (break) some jump-ins and combos. Certain characters also have extra throw moves.
                    </p>
                    ` },
                {
                    src: "/gameplay/videos/supers.mp4", text: `
                    <h1>Supers</h1>
                    <p>
                        Up to 3 stocks can be stored in the super meter, which builds through attacking, dashing, taunting, and by receiving or blocking hits.
                    </p>
                    ` },
                {
                    src: "/gameplay/videos/juggles.mp4", text: `
                    <h1>Combos</h1>
                    <p>
                        Breakers Revenge delivers an accessible combo system, featuring generous input buffering and plenty of cancelable moves and super juggles.                   </p>
                    ` },
                {
                    src: "/gameplay/videos/roll.mp4", text: `
                    <h1>Back roll</h1>
                    <p>
                        <span class="arcadebutton A"></span>+<span class="arcadebutton B"></span>+<span class="arcadebutton C"></span><br>
                        After taking a non-super hit, press 3 buttons while you’re knocked down to perform a back-roll. This can help you defend against powerful okizeme setups.
                    </p>
                    ` },
                {
                    src: "/gameplay/videos/dash.mp4", text: `
                    <h1>Dashes</h1>
                    <p>
                        →→ / ←← <br>
                        Except Condor, all characters can dash, with some utilizing backdash invincibility or dash-cancels for better mobility.
                    </p>
                    ` },
                {
                    src: "/gameplay/videos/dizzy.mp4", text: `
                    <h1>Dizzy</h1>
                    <p> Repeated hits can cause dizziness. While dizzy, mash the directional inputs and buttons to recover more quickly. The recovery animation provides a brief window of invincibility.</p>
                    ` },
                {
                    src: "/gameplay/videos/chip.mp4", text: `
                    <h1>Chip damage</h1>
                    <p>
                        Chip damage, sustained while blocking, can lead to a KO. Use specials to finish opponents, as supers deal minimal chip damage.
                    </p>
                    ` },
                {
                    src: "/gameplay/videos/breakers.mp4", text: `
                    <h1>Break</h1>
                    <p>
                        Some combos can be interrupted with backdashes, throws, or certain attacks. Use breakable combos to maximize damage against unaware opponents, but opt for unbreakable ones when you need reliable safety.
                        </p>
                    ` },
                {
                    src: "/gameplay/videos/risk.mp4", text: `

                    <h1>Risk system</h1>
                    Attack and defense increase after losing 1/3 of your life. The life leader also takes more damage (reset at equal health).<br><br>
                    Waiting longer powers up your next hit, up to double damage !<br><br>
                    The round winner takes more damage, while the loser gains defense. Be aware that these two effects carry over between matches. Arcade cabinets are often reset to keep things fair.
                


                        
                    ` }
            ];

            let index = 0;

            // Create dots dynamically
            videos.forEach((_, i) => {
                const dot = document.createElement("span");
                dot.classList.add("dot");
                dot.addEventListener("click", () => {
                    index = i;
                    showVideo();
                });
                dotsContainer.appendChild(dot);
            });

            const dots = dotsContainer.querySelectorAll(".dot");

            function updateDots() {
                dots.forEach((dot, i) => {
                    dot.classList.toggle("active", i === index);
                });
            }

            function showTVNoise() {
                if (!tvNoise) return;
                tvNoise.classList.add("show");
                setTimeout(() => {
                    tvNoise.classList.remove("show");
                }, 700);
            }

            function showVideo() {
                showTVNoise();
                const current = videos[index];
                video.pause();
                playBtn.style.display = "flex"; // show play button again
                video.src = current.src;
                text.innerHTML = current.text;
                prev.disabled = index === 0;
                next.disabled = index === videos.length - 1;
                updateDots();
                video.load();
            }

            prev.addEventListener("click", () => {
                if (index > 0) index--;
                showVideo();
            });

            next.addEventListener("click", () => {
                if (index < videos.length - 1) index++;
                showVideo();
            });

            // Play button logic
            playBtn.addEventListener("click", () => {
                video.play();
                playBtn.style.display = "none";
            });

            video.addEventListener("pause", () => {
                playBtn.style.display = "flex";
            });

            video.addEventListener("play", () => {
                playBtn.style.display = "none";
            });

            showVideo();
        });

        // Responsive button positioning
        document.addEventListener("DOMContentLoaded", () => {
            const videoText = document.querySelector('#video-text');
            const buttonContainer = document.querySelector('.button-container');

            // Save original desktop position (after video-text)
            const originalParent = buttonContainer.parentNode;
            const originalNextSibling = buttonContainer.nextSibling;

            function handlePosition() {
                if (window.innerWidth <= 991) {
                    // MOBILE: move before #video-text
                    videoText.parentNode.insertBefore(buttonContainer, videoText);
                } else {
                    // DESKTOP: restore original placement
                    if (buttonContainer.parentNode !== originalParent) {
                        originalParent.insertBefore(buttonContainer, originalNextSibling);
                    }
                }
            }
            handlePosition();
            window.addEventListener('resize', handlePosition);
        });
    </script>

</body>



</html>
