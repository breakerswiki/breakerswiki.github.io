<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="UTF-8">
  <base href="/" />
  <title>Breakers Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Breakers revenge, core mechanics, character playstyles, and matchup tips" />
  <meta name="theme-color">
  <meta name="keywords" content="breakers, breakers revenge, wiki, neogeo, arcade, snk, visco">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="script.js"></script>
</head>


<body>


  <div id="header-container"></div>


  <section class="main-content">

  
    <div class="bottom-div" id="bottom-div">
      
      <center>
        <div class="title">Gallery</div>
      </center>


      <div class="slideshow">
        <img class="slide active" src="img/assets/breakersrevenge_1.png" alt="Slide 1">
        <img class="slide" src="img/assets/breakersrevenge_2.png" alt="Slide 2">
        <img class="slide" src="img/assets/breakersrevenge_3.png" alt="Slide 3">
        <img class="slide" src="img/assets/breakersrevenge_4.png" alt="Slide 4">
        <img class="slide" src="img/assets/breakersrevenge_5.png" alt="Slide 5">
        <img class="slide" src="img/assets/breakersrevenge_6.png" alt="Slide 6">
        <img class="slide" src="img/assets/breakersrevenge_7.png" alt="Slide 7">
    </div>
    <script>
        let slides = document.querySelectorAll('.slide');
        let index = 0;
        setInterval(() => {
            slides[index].classList.remove('active');
            index = (index + 1) % slides.length;
            slides[index].classList.add('active');
        }, 3000);
    </script>
   




  </section>

  <!-- footer  -->
  <div id="footer-container"></div>



</body>

</html>
