<body>
  <div id="header-container"></div>
  <section class="main-content" style="max-width: 970px;">
    <div class="top-div">
      <div class="container" style="gap: 0px;">
        <div class="main" style="display: grid; align-items: center; align-content: center;">
          <div class="title">Underrated Arcade Classic</div>
          <p class="description">
            Learn about <b>Breakers Revenge</b>,<br> a lesser-known Neo Geo fighting game, easy to pick up and fun to
            play !</p>
          <div class="breakers-series">
            <a
              data-text='
              <iframe width="100%" height="248px" src="https://www.youtube.com/embed/8SF_IVrEaBY?si=T_KkYWrkdSluZjNR" 
                loading="lazy" title="YouTube video player" frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
              </iframe>
              Released on <b>March 21, 1996</b>, for the Neo Geo MVS by VISCO and SNK, <b>Breakers</b> stood out for its accessibility and vibrant art. Originally conceived in 1993 as Tenrin no Syo Chicago (<a target="_blank" href="https://archive.org/details/rgz5f4">Crystal Legacy</a>), Breakers set itself apart from other fighters of the era.'>
              <img src="img/assets/boxart_Breakers.webp">
            </a>
            <a
              data-text='
              <iframe width="100%" height="265px" src="https://www.youtube.com/embed/yUf1b-d2WM4?si=fqJdeWevsBoim0Qi" 
                loading="lazy" title="YouTube video player" frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
              </iframe>
               Released on <b>July 2, 1998</b>, for Neo Geo MVS and AES, <b>Breakers Revenge</b>, sequel to Breakers, adds new art, stages, colors, and Saizo. Its smooth gameplay and memorable characters made it a retro classic with a loyal fanbase.'>
              <img src="img/assets/boxart_Breakers_Revenge.webp">
            </a>
            <a data-text='
              <iframe width="100%" height="200px" src="https://www.youtube.com/embed/hhbLiZiJU-8?si=GsdWDkG98QLadufX" 
                loading="lazy" title="YouTube video player" frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
              </iframe>
               On <b>January 12, 2023</b>, QUByte Interactive released <b>Breakers Collection</b> for consoles and PC, featuring Breakers and Breakers Revenge with cross-play, leaderboards, updated visuals, training, and team battle.
               '>
              <img src="img/assets/boxart_Breakers_Collection.webp">
            </a>

            <a
              data-text='
              <iframe width="100%" height="200px" src="https://www.youtube.com/embed/TQ0KpEspuho?si=yc3FpKtS1v35w128" 
                loading="lazy" title="YouTube video player" frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
              </iframe>
               Released on <b>August 22, 2024</b> for EXA-Arcadia, <b>Breakers Revenge Chicago</b> takes its name from the original prototype and features new colors, Bai-hu, training, all-series stages, a new announcer, Neo Geo CD soundtrack, and three modes: Revenge, Extra, and Chicago.'>
              <img src="img/assets/boxart_Breakers_Chicaco.webp">
            </a>
          </div>

          <!-- Popup -->
          <div id="popup" class="popup">
            <div class="popup-content breakers-popup">
              <span class="close">&times;</span>
              <p id="popup-text"></p>
            </div>
          </div>



        </div>

        <div class="content">
          <div class="cabinet-container">

              <source src="img/assets/breakrev_intro.mp4" type="video/mp4">
            </video>

          </div>
        </div>
