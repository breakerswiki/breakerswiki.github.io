<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="UTF-8">
  <base href="/" />
  <title>Breakers Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Breakers revenge, core mechanics, character playstyles, and matchup tips" />
  <meta name="theme-color">
  <meta name="keywords" content="breakers, breakers revenge, wiki, neogeo, arcade, snk, visco">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="/img/manifest.json">
  <script src="script.js"></script>
</head>


<body>
  <div id="header-container"></div>
  <section class="main-content" style="max-width: 970px;">
    <div class="top-div">
      <div class="container" style="gap: 0px;">
        <div class="main" style="display: grid; align-items: center; align-content: center;">
          <div class="title">Welcome to Breakers wiki</div>
          <p class="description">
            Learn about <b>Breakers Revenge</b>,<br> a lesser-known Neo Geo fighting game, easy to pick up and fun toplay !</p>
          <div class="breakers-series">
            <a target="_blank" href="https://www.youtube.com/watch?v=8SF_IVrEaBY"><img src="img/assets/boxart_Breakers.webp"></a>
            <a target="_blank" href="https://www.youtube.com/watch?v=yUf1b-d2WM4"><img src="img/assets/boxart_Breakers_Revenge.webp"></a>
            <a target="_blank" href="https://www.youtube.com/watch?v=hhbLiZiJU-8"><img src="img/assets/boxart_Breakers_Collection.webp"></a>
            <a target="_blank" href="https://www.youtube.com/watch?v=TQ0KpEspuho"><img src="img/assets/boxart_Breakers_Chicaco.webp"></a>
          </div>

        </div>



        <div class="content">

          <div class="cabinet-container">
            <!-- Cabinet Image -->
            <img src="img/assets/TaitoEgretII.webp" class="arcadecab" alt="Arcade Cabinet" loading="lazy">
            <!-- Video -->
            <video class="videointro" style="border-radius: 10px;" loop muted autoplay playsinline preload="none">
              <source src="img/assets/breakrev_intro.mp4" type="video/mp4">
            </video>
          </div>
        </div>

      </div>


    <div class="scroll-container">
      <div class="arrow"></div>
    </div>

    </div>


    <div class="subtitle" style="margin: 0 auto; text-align: center; margin-top: 120px; margin-bottom: 50px;">How to play</div>

        <div class="gameplay">

            <div class="tv-container">
                <img src="/img/assets/TV.webp" class="tv" loading="lazy" alt="Decorative TV frame">

                <div>
                    <div class="tv-noise"></div>

                    <video id="gameplay-video" playsinline loop preload="metadata">
                        <source src="/img/assets/gameplay/videos/br-how-to-play.mp4" type="video/mp4">
                        Your browser does support HTML5 video.
                    </video>
                    <button class="play-button" id="playBtn">▶</button>

                </div>

            </div>


            <div id="video-text" class="video-text">

            </div>

        </div>

        <div class="button-container">
            <button class="card-nav-button prev-button" aria-label="Previous">❮</button>
            <div id="card-dots" class="card-dots"></div>
            <button class="card-nav-button next-button" aria-label="Next">❯</button>
        </div>


    <div class="subtitle" style="margin: 0 auto; text-align: center; padding-top: 120px; margin-top: 120px; margin-bottom: 50px;">Character Select</div>

    <div class="character-select">
      <a href="/characters/sho" class="character sho"><div><span>Sho</span></div></a>
      <a href="/characters/pielle/" class="character pielle"><div><span>Pielle</span></div></a>
      <a href="/characters/condor/" class="character condor"><div><span>Condor</span></div></a>
      <a href="/characters/rila/" class="character rila"><div><span>Rila</span></div></a>
      <a href="/characters/tia/" class="character tia"><div><span>Tia</span></div></a>
      <a href="/characters/alsion/" class="character alsion"><div><span>Alsion</span></div></a>
      <a href="/characters/maherl/" class="character maherl"><div><span>Maherl</span></div></a>
      <a href="/characters/dao-long/" class="character daolong"><div><span>Dao-long</span></div></a>
      <a href="/characters/saizo/" class="character saizo"><div><span>Saizo</span></div></a>
      <a href="/characters/bai-hu/" class="character baihu"><div><span>Bai-hu</span></div></a>
    </div>



  </section>

  

  <!-- footer  -->
  <div id="footer-container"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const video = document.getElementById("gameplay-video");
            const text = document.getElementById("video-text");
            const dotsContainer = document.getElementById("card-dots");
            const prev = document.querySelector(".prev-button");
            const next = document.querySelector(".next-button");
            const tvNoise = document.querySelector(".tv-noise");
            const playBtn = document.getElementById("playBtn");



            const videos = [
                {
                    src: "/img/assets/gameplay/videos/br-how-to-play.mp4",
                    text: `
                    <h1>Button layout</h1>
                    <p>
                        <span class="arcadebutton A"></span><span class="arcadebutton C"></span>= Punch <br> <span class="arcadebutton B"></span><span style="margin-bottom:20px" class="arcadebutton D"></span>= Kick
                        <br>
                        In arcade settings, Breakers Revenge is traditionally played on a square layout.
                    </p>
                    `},
                {
                    src: "/img/assets/gameplay/videos/throw.mp4", text: `
                    <h1>Throws</h1>
                    <p>
                        → or ← + <span style="margin-bottom:20px" class="arcadebutton C"></span><br>
                        Certain characters have extra throw inputs or air-throws. Throws can also be used to break combos.
                    </p>
                    ` },
                {
                    src: "/img/assets/gameplay/videos/supers.mp4", text: `
                    <h1>Supers</h1>
                    <p>
                        Almost any action fills the Super meter: attacking, taunting, dashing, blocking or taking hits. All characters have multiple Supers, and each consumes 1 meter.
                    </p>
                    ` },
                {
                    src: "/img/assets/gameplay/videos/juggles.mp4", text: `
                    <h1>Combos</h1>
                    <p>
                      Breakers Revenge makes combos quite easy because it uses a generous input buffer, most characters have plenty of move cancels, and there are frequent super juggle opportunities.
                    </p>
                    ` },
                {
                    src: "/img/assets/gameplay/videos/roll.mp4", text: `
                    <h1>Back roll</h1>
                    <p>
                        <span class="arcadebutton A"></span>+<span class="arcadebutton B"></span>+<span style="margin-bottom:20px" class="arcadebutton C"></span><br>
                        After taking a non-super hit, press 3 buttons while you’re knocked down to perform a back-roll. This can help you defend against powerful okizeme setups.
                    </p>
                    ` },
                {
                    src: "/img/assets/gameplay/videos/dash.mp4", text: `
                    <h1>Dashes</h1>
                    <p>
                        →→ or ←← <br><br>
                        Except Condor, all characters can dash, with some utilizing backdash invincibility or dash-cancels for better mobility.
                    </p>
                    ` },
                {
                    src: "/img/assets/gameplay/videos/dizzy.mp4", text: `
                    <h1>Dizzy</h1>
                    <p> Repeated hits can cause dizziness. While dizzy, mash the directional inputs and buttons to recover more quickly. The recovery animation provides a brief window of invincibility.</p>
                    ` },
                {
                    src: "/img/assets/gameplay/videos/chip.mp4", text: `
                    <h1>Chip damage</h1>
                    <p>
                        Blocking causes chip damage, which can lead to a KO. Use special moves to finish opponents, as supers deal minimal chip damage.
                    </p>
                    ` },
                {
                    src: "/img/assets/gameplay/videos/breakers.mp4", text: `
                    <h1>Break</h1>
                    <p>
                        Based on your character, interrupt specific combos with backdashes, throws or certain quick attacks.<br>
                        Use breakable combos for high damage against unaware opponents, and unbreakable ones for safety.
                        </p>
                    ` },
                {
                    src: "/img/assets/gameplay/videos/risk.mp4", text: `

                    <h1>Risk System</h1>
                        <div class="risk-system">
                            <div class="scroll-content">
                                <ul>
                                    <li>After losing 1/3 life : attack and defense increase.</li>
                                    <li>The player with more health takes extra damage until both health bars are equal.</li>
                                    <li>The longer you wait, the stronger your next hit becomes. Up to double damage.</li>
                                    <li>Winner takes more damage, loser gains defense. Both stack with the beat-by count. (In arcades, the game is often reset to keep things fair)</li>
                                </ul>
                            </div>
                        </div>
  


                        
                    ` }
            ];

            let index = 0;

            // Create dots dynamically
            videos.forEach((_, i) => {
                const dot = document.createElement("span");
                dot.classList.add("dot");
                dot.addEventListener("click", () => {
                    index = i;
                    showVideo();
                });
                dotsContainer.appendChild(dot);
            });

            const dots = dotsContainer.querySelectorAll(".dot");

            function updateDots() {
                dots.forEach((dot, i) => {
                    dot.classList.toggle("active", i === index);
                });
                prev.style.color = (index === 0) ? "transparent" : "inherit";
                next.style.color = (index === dots.length - 1) ? "transparent" : "inherit";
                prev.style.pointerEvents = (index === 0) ? "none" : "auto";
                next.style.pointerEvents = (index === dots.length - 1) ? "none" : "auto";
            }

            function showTVNoise() {
                if (!tvNoise) return;
                tvNoise.classList.add("show");
                setTimeout(() => {
                    tvNoise.classList.remove("show");
                }, 700);
            }

            function showVideo() {
                showTVNoise();
                const current = videos[index];
                video.pause();
                playBtn.style.display = "flex"; // show play button again
                video.src = current.src;
                text.innerHTML = current.text;
                prev.disabled = index === 0;
                next.disabled = index === videos.length - 1;
                updateDots();
                video.load();
            }

            prev.addEventListener("click", () => {
                if (index > 0) index--;
                showVideo();
            });

            next.addEventListener("click", () => {
                if (index < videos.length - 1) index++;
                showVideo();
            });

            // Play button logic
            playBtn.addEventListener("click", () => {
                video.play();
                playBtn.style.display = "none";
            });

            video.addEventListener("pause", () => {
                playBtn.style.display = "flex";
            });

            video.addEventListener("play", () => {
                playBtn.style.display = "none";
            });

            showVideo();
        });

        // Responsive button positioning
        document.addEventListener("DOMContentLoaded", () => {
            const videoText = document.querySelector('#video-text');
            const buttonContainer = document.querySelector('.button-container');

            // Save original desktop position (after video-text)
            const originalParent = buttonContainer.parentNode;
            const originalNextSibling = buttonContainer.nextSibling;

            function handlePosition() {
                if (window.innerWidth <= 991) {
                    // MOBILE: move before #video-text
                    videoText.parentNode.insertBefore(buttonContainer, videoText);
                } else {
                    // DESKTOP: restore original placement
                    if (buttonContainer.parentNode !== originalParent) {
                        originalParent.insertBefore(buttonContainer, originalNextSibling);
                    }
                }
            }
            handlePosition();
            window.addEventListener('resize', handlePosition);
        });
    </script>


</body>

</html>
