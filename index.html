<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="UTF-8">
  <base href="/" />
  <title>Breakers Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Breakers revenge, core mechanics, character playstyles, and matchup tips" />
  <meta name="theme-color">
  <meta name="keywords" content="breakers, breakers revenge, wiki, neogeo, arcade, snk, visco">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="/img/manifest.json">
  <script src="script.js"></script>
</head>


<body>
  <div id="header-container"></div>
  <section class="main-content" style="max-width: 970px;">
    <div class="top-div">
      <div class="container" style="gap: 0px;">
        <div class="main" style="display: grid; align-items: center; align-content: center;">
          <div class="title">Underrated Arcade Classic</div>
          <p class="description">
            Learn about <b>Breakers Revenge</b>,<br> a lesser-known Neo Geo fighting game, easy to pick up and fun to play !</p>
          <div class="breakers-series">
            <a
              data-text="<img src='img/assets/boxart_Breakers.webp' class='float-img'> Released on <b>March 21, 1996</b>, for the Neo Geo MVS by VISCO and SNK, <b>Breakers</b> stood out for its accessibility and vibrant art. Originally conceived in 1993 as Tenrin no Syo Chicago (<a target='_blank' href='https://archive.org/details/rgz5f4'>Crystal Legacy</a>), Breakers set itself apart from other fighters of the era.">
              <img src="img/assets/boxart_Breakers.webp">
            </a>
            <a
              data-text="<img src='img/assets/boxart_Breakers_Revenge.webp' class='float-img'> Released on <b>July 2, 1998</b>, for Neo Geo MVS and AES, <b>Breakers Revenge</b>, sequel to Breakers, adds new art, stages, colors, and Saizo. Its smooth gameplay and memorable characters made it a retro classic with a loyal fanbase.">
              <img src="img/assets/boxart_Breakers_Revenge.webp">
            </a>
            <a
              data-text="<img src='img/assets/boxart_Breakers_Collection.webp' class='float-img'> On <b>January 12, 2023</b>, QUByte Interactive released <b>Breakers Collection</b> for consoles and PC, featuring Breakers and Breakers Revenge with cross-play, leaderboards, updated visuals, training, and team battle.">
              <img src="img/assets/boxart_Breakers_Collection.webp">
            </a>
            <a
              data-text="<img src='img/assets/boxart_Breakers_Chicaco.webp' class='float-img'> Released on <b>August 22, 2024</b> for EXA-Arcadia, <b>Breakers Revenge Chicago</b> takes its name from the original prototype and features new colors, Bai-hu, training, all-series stages, a new announcer, Neo Geo CD soundtrack, and three modes: Revenge, Extra, and Chicago.">
              <img src="img/assets/boxart_Breakers_Chicaco.webp">
            </a>
          </div>

          <!-- Popup -->
          <div id="popup" class="popup">
            <div class="popup-content">
              <span class="close">&times;</span>
              <p id="popup-text"></p>
            </div>
          </div>


          <script>
            const popup = document.getElementById('popup');
            const popupText = document.getElementById('popup-text');

            document.querySelectorAll('.breakers-series a').forEach(link => {
              link.addEventListener('click', () => {
                const text = link.getAttribute('data-text');
                document.getElementById('popup-text').innerHTML = text; // use innerHTML
                popup.classList.add('show');
              });
            });

            document.querySelector('.close').addEventListener('click', () => {
              popup.classList.remove('show');
            });

            popup.addEventListener('click', (e) => {
              if (e.target.id === 'popup') {
                popup.classList.remove('show');
              }
            });


          </script>

        </div>

        <div class="content">
          <div class="cabinet-container">
            <!-- Cabinet Image -->
            <img src="img/assets/TaitoEgret.png" class="arcadecab" alt="Arcade Cabinet" loading="lazy">
            <!-- Video -->
            <video class="videointro" style="border-radius: 10px;" loop muted autoplay playsinline preload="none">
              <source src="img/assets/breakrev_intro.mp4" type="video/mp4">
            </video>

          </div>
        </div>

      </div>

    </div>

  </section>

  <!-- footer  -->
  <div id="footer-container"></div>

  <!-- Thumbnail Fullscreen image container -->
  <div id="fullscreen-container" style="display:none;">
    <img id="fullscreen-image" src="" alt="Fullsize" loading="lazy">
  </div>


</body>

</html>
