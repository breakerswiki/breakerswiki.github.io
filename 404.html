<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Breakers revenge, core mechanics, character playstyles, and matchup tips" />
    <meta name="theme-color">
    <meta name="keywords" content="breakers, breakers revenge, wiki, neogeo, arcade, snk, visco">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="img/assets/apple-touch-icon.png">
    <link rel="manifest" href="img/manifest.json">
    <script src="script.js"></script>
</head>


<body>
    <section class="main-content">
        <h1>404 - Page Not Found</h1>
        <p>Oops! The page you're looking for doesn't exist.</p>
        <p>You will be redirected to the <a href="/">homepage</a> in <span id="countdown">5</span> seconds.</p>
        <p>If you are not redirected, <a href="/">click here</a>.</p>

        <script>
            let countdown = 5; // Redirect after 5 seconds
            const countdownElement = document.getElementById("countdown");

            const interval = setInterval(() => {
                countdown--;
                countdownElement.textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(interval);
                    window.location.href = "/";
                }
            }, 1000);
        </script>
    </section>
</body>



</html>
